name: daily-paper-digest

on:
  schedule:
    # 00:00 UTC == 07:00 Asia/Ho_Chi_Minh (UTC+7). GitHub cron is always UTC.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Needed so the job can commit the updated SQLite DB back to the repo.
permissions:
  contents: write

# Prevent overlapping runs from racing on the DB commit.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}   # optional
        run: python main.py

      - name: Persist dedupe DB
        run: |
          if [[ -n "$(git status --porcelain digest.db)" ]]; then
            git config user.name  "digest-bot"
            git config user.email "digest-bot@users.noreply.github.com"
            git add digest.db
            git commit -m "chore: update dedupe DB [skip ci]"
            git push
          else
            echo "No DB changes to commit."
          fi
